# ~ /project1-aws/ansible/roles/common/handlers/main.yml
---
# 시스템 시간대 변경 시 관련 서비스 재시작 (필요한 경우)
- name: restart crond
  # 이유: timezone 변경 후 cron 데몬을 재시작해야 변경된 시간대가 반영됨
  # Amazon Linux 2023에서 crond 서비스명 확인
  systemd:
    name: crond
    state: restarted
  become: yes
  # 이유: crond가 없는 환경에서 오류 방지
  ignore_errors: yes
  failed_when: false

# 저널 로그 설정 변경 시 반영
- name: restart systemd-journald
  systemd:
    name: systemd-journald
    state: restarted
  become: yes