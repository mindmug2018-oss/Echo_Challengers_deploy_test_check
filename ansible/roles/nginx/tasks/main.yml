# ~/project1-aws/ansible/roles/nginx/tasks/main.yml

---
- name: 1. Nginx 패키지 설치
  dnf:
    name: nginx
    state: present
  become: yes

- name: 2. 기존 기본 설정 파일 제거 (충돌 방지)
  file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  become: yes

- name: 3. FastAPI 리버스 프록시 설정 (Template 활용)
  template:
    src: fastapi.conf.j2
    dest: /etc/nginx/conf.d/fastapi.conf
    mode: '0644'
  become: yes
  notify: restart nginx

- name: 4. Nginx 설정 테스트
  command: nginx -t
  become: yes

- name: 5. Nginx 서비스 시작 및 활성화
  systemd:
    name: nginx
    state: started
    enabled: yes
    daemon_reload: yes
  become: yes

- name: 6. 정적 파일 디렉토리 생성
  file:
    path: /usr/share/nginx/html/static
    state: directory
    mode: '0755'
  become: yes

- name: 7. 서버 정보가 포함된 index.html 생성 (Template)
  template:
    src: index.html.j2
    dest: /usr/share/nginx/html/static/index.html
    mode: '0644'
  become: yes