# ~/project1-aws/ansible/roles/node_exporter/tasks/main.yml
---

- name: 0. Node Exporter 설치 여부 확인
  stat:
    path: /usr/local/bin/node_exporter
  register: ne

- name: 1. Node Exporter 전용 유저 생성
  user:
    name: node_exporter
    shell: /sbin/nologin
    create_home: no
  become: yes

- name: 2. Node Exporter 바이너리 다운로드 및 압축 해제
  unarchive:
    src: https://github.com/prometheus/node_exporter/releases/download/v1.8.1/node_exporter-1.8.1.linux-amd64.tar.gz
    dest: /tmp/
    remote_src: yes
  when: not ne.stat.exists
  become: yes

- name: 3. 실행 파일 설치 (/usr/local/bin)
  copy:
    src: /tmp/node_exporter-1.8.1.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    mode: '0755'
    remote_src: yes
    owner: node_exporter
    group: node_exporter
  when: not ne.stat.exists
  become: yes
  notify: restart node_exporter

- name: 4. systemd 서비스 등록 (Template 활용)
  template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  become: yes
  notify: restart node_exporter

- name: 5. 서비스 시작 및 활성화
  systemd:
    name: node_exporter
    state: started
    enabled: yes
    daemon_reload: yes
  become: yes