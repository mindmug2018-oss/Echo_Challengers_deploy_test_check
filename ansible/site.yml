# ~/project1-aws/ansible/site.yml
---
# 0-A. 퍼블릭 서비스 노드 및 관리 서버 기초 공사
# 이유: 이 노드들은 외부 인터넷에서 직접 SSH 접근이 가능하므로 먼저 구성합니다.
- name: 0-A. 퍼블릭 서버 기초 공사 (웹 및 관리 노드)
  hosts: mgmt:webservers
  roles:
    - common

# 1. 웹 서버 애플리케이션 및 엔진엑스 빌드
- import_playbook: playbooks/web.yml

# 2. mgmt 서버 모니터링 구성 완료
# 이유: 이 단계가 끝나야 mgmt 노드가 완벽한 상태로 터널링을 대기할 수 있습니다.
- import_playbook: playbooks/mgmt.yml

# 0-B. 프라이빗 DB 서버 기초 공사 (이제 터널이 확보됨)
# 이유: mgmt 서버 구성이 완벽히 끝난 후 안전하게 터널을 통해 접근합니다.
- name: 0-B. 프라이빗 서버 기초 공사 (데이터베이스 노드)
  hosts: databases
  roles:
    - common

# 3. DB 서버 어플리케이션 특화 설정 (PostgreSQL)
- import_playbook: playbooks/db.yml

# ※ monitoring은 mgmt.yml 안에 포함 → 여기서 별도 선언 안 함

- name: 배포 완료 안내
  hosts: localhost
  gather_facts: no
  tasks:
    - name: 접속 정보 출력
      debug:
        msg:
          - "=========================================================="
          - "배포가 완료되었습니다!"
          - "ALB:        http://[ALB-DNS]/health"
          - "Grafana:    http://[MGMT-IP]:3000  (admin/admin)"
          - "Prometheus: http://[MGMT-IP]:9090"
          - "IP 확인:    cd terraform && terraform output"
          - "=========================================================="