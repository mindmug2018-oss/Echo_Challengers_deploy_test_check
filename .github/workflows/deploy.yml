name: DevOps Team Project - Infrastructure CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Validate, and Test Stack
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up AWS credentials securely
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # Step 3: Setup Terraform matching your project constraints
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ./terraform

      # Note: Suppress backend initialization checks if teammate hasn't mapped S3 yet
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform
        env:
          TF_VAR_tailscale_api_key: ${{ secrets.TAILSCALE_API_KEY }}
          TF_VAR_tailnet_name: ${{ secrets.TAILNET_NAME }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      # Step 4: Set up Python environment to run Ansible tools
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 5: Install Ansible
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # Step 6: FIXED ANSIBLE SYNTAX CHECK STEP
      # We use $GITHUB_WORKSPACE to create an absolute path to your roles.
      # This ensures nested playbooks inside playbooks/ can still find them.
      - name: Ansible Syntax Check
        run: |
          ansible-playbook --syntax-check site.yml -i "localhost,"
        working-directory: ./ansible
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles

      # Step 7: Validate custom chaos and recovery shell script structures
      - name: Lint Chaos & Recovery Scripts
        run: |
          echo "Checking syntax for shell scripts..."
          bash -n ./chaos/inject.sh
          bash -n ./recovery/scripts/restart_nginx.sh
          bash -n ./recovery/scripts/restart_fastapi.sh
          bash -n ./recovery/scripts/restart_postgres.sh
          bash -n ./bootstrap_tailscale.sh