name: DevOps Team Project - Automated Metric Screenshot

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  live-screenshot-test:
    name: Provision, Inject Chaos, Snap Grafana, and Destroy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone repository
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS Authentication
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # Step 3: Setup Terraform matching main.tf rules
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false
          

      # Step 4: Spin up live stack (Triggers EC2 builds and your Ansible playbooks)
      - name: Terraform Apply (Spin Up Stack)
        run: |
          terraform init
          terraform apply -auto-approve
        working-directory: ./terraform
        env:
          TF_VAR_tailscale_api_key: ${{ secrets.TAILSCALE_API_KEY }}
          TF_VAR_tailnet_name: ${{ secrets.TAILNET_NAME }}
          TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_API_KEY }}
          TF_VAR_slack_webhook_monitoring: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_MONITORING: ${{ secrets.SLACK_WEBHOOK_URL }} 
          DB_PASSWORD_SECRET: ${{ secrets.DB_PASSWORD }}
          ANSIBLE_STDOUT_CALLBACK: default

      # Step 5: JUST-IN-TIME GRAFANA TOKEN GENERATION
      # This step bypasses the shifting IP issue entirely by logging into the fresh instance via SSH, 
      # creating a temporary service account token, and saving it to the local runner environment variable block.
      - name: Generate Dynamic Grafana API Token
        id: grafana_auth
        run: |
          # 1. Fetch the newly generated server IP and the private key path
          MGMT_IP=$(cd ./terraform && terraform output -raw mgmt_public_ip 2>/dev/null)
          KEY_PATH="./terraform/proj-aws-key.pem"
          chmod 400 $KEY_PATH
          
          echo "Connecting to Management Node at ${MGMT_IP} to provision dynamic API token..."
          
          # 2. Run remote commands to create a temporary Grafana service account and token
          # We use a loop check to ensure the grafana-server service is fully active before running the CLI
          ssh -i $KEY_PATH -o StrictHostKeyChecking=no ec2-user@$MGMT_IP << 'EOF'
          until systemctl is-active --quiet grafana-server; do
            echo "Waiting for Grafana service to launch..."
            sleep 5
          done

          SA_RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" \
            -u admin:admin \
            -d '{"name":"github-ci-sa","role":"Admin"}' \
            http://localhost:3000/api/serviceaccounts)
          SA_ID=$(echo $SA_RESPONSE | grep -oP '"id":\K\d+')

          TOKEN_RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" \
            -u admin:admin \
            -d '{"name":"github-token"}' \
            http://localhost:3000/api/serviceaccounts/$SA_ID/tokens)
          echo $TOKEN_RESPONSE | grep -oP '"key":"\K[^"]+' > raw_token.txt
          EOF
          
          # 3. Pull the generated token back into the GitHub Actions cloud environment safely
          DYNAMIC_TOKEN=$(ssh -i $KEY_PATH -o StrictHostKeyChecking=no ec2-user@$MGMT_IP "cat raw_token.txt")
          
          # 4. Save variables into the GitHub runner step outputs for subsequent blocks to use
          echo "token=$DYNAMIC_TOKEN" >> $GITHUB_OUTPUT
          echo "mgmt_ip=$MGMT_IP" >> $GITHUB_OUTPUT

      # Step 6: Inject the heavy load script to simulate metrics crash
      - name: Inject Heavy Stress Load (Trigger Alert)
        run: |
          chmod +x ./chaos/inject.sh
          echo "🔥 Injecting high stress load to spike server specs..."
          ./chaos/inject.sh fastapi1
          
          echo "Waiting 30 seconds for Prometheus to record the metric wall spike..."
          sleep 30
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Render Grafana Dashboard & Upload Image to Slack
        run: |
          MGMT_IP="${{ steps.grafana_auth.outputs.mgmt_ip }}"
          API_TOKEN="${{ steps.grafana_auth.outputs.token }}"

          # Dynamically fetch dashboard UID by name
          DASHBOARD_RESPONSE=$(curl -s \
            -H "Authorization: Bearer $API_TOKEN" \
            "http://${MGMT_IP}:3000/api/search?type=dash-db")
          DASHBOARD_UID=$(echo $DASHBOARD_RESPONSE | grep -oP '"uid":"\K[^"]+' | head -1)

          echo "Found dashboard UID: $DASHBOARD_UID"

          curl -s -L -o chaos_spike.png \
            -H "Authorization: Bearer $API_TOKEN" \
            "http://${MGMT_IP}:3000/render/d-solo/${DASHBOARD_UID}/system-metrics?panelId=1&width=1000&height=500"

          curl -F file=@chaos_spike.png \
              -F "initial_comment=📊 *CI/CD Automation Monitoring:* Verified Grafana metric wall spike following fault injection on web1 server!" \
              -F channels=${{ secrets.SLACK_CHANNEL_ID }} \
              -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
              https://slack.com/api/files.upload

      # Step 8: Safe automated cleanup
      - name: Automated Cloud Teardown
        if: always()
        run: terraform destroy -auto-approve
        working-directory: ./terraform
        env:
          TF_VAR_tailscale_api_key: ${{ secrets.TAILSCALE_API_KEY }}
          TF_VAR_tailnet_name: ${{ secrets.TAILNET_NAME }}
          TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_API_KEY }}
          DB_PASSWORD_SECRET: ${{ secrets.DB_PASSWORD }}
          SLACK_WEBHOOK_MONITORING: ${{ secrets.SLACK_WEBHOOK_URL }} 