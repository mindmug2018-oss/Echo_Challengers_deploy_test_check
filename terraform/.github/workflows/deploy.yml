name: DevOps Team Project - Infrastructure CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Validate, and Test Stack
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up AWS credentials securely
      # Your teammates won't need to download local credentials. They just manage them in GitHub Secrets.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # Step 3: Install and initialize Terraform matching your version constraint
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0" # Matches your >= 1.14.0 rule

      # Step 4: Verify formatting and syntax of main.tf / variables.tf
      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ./terraform

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform
        env:
          TF_VAR_tailscale_api_key: ${{ secrets.TAILSCALE_API_KEY }}
          TF_VAR_tailnet_name: ${{ secrets.TAILNET_NAME }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      # Step 5: Set up Python environment to run Ansible tools
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 6: Install Ansible and quality-assurance tools
      - name: Install Ansible & Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      # Step 7: Verify Ansible playbook rules without running live hosts
      - name: Ansible Syntax Check
        run: |
          ansible-playbook --syntax-check site.yml
        working-directory: ./ansible

      # Step 8: Validate custom shell scripts syntax (inject, auto-healing, tailscale)
      - name: Lint Chaos & Recovery Scripts
        run: |
          echo "Checking syntax for shell scripts..."
          bash -n ./chaos/inject.sh
          bash -n ./recovery/scripts/restart_nginx.sh
          bash -n ./recovery/scripts/restart_fastapi.sh
          bash -n ./recovery/scripts/restart_postgres.sh
          bash -n ./bootstrap_tailscale.sh

      # Optional Deployment Trigger Step:
      # If you actually want GitHub Actions to run the full build on push to main:
      # - name: Terraform Apply (Auto-Deploy)
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   run: terraform apply -auto-approve
      #   working-directory: ./terraform
      #   env:
      #     TF_VAR_tailscale_api_key: ${{ secrets.TAILSCALE_API_KEY }}
      #     TF_VAR_tailnet_name: ${{ secrets.TAILNET_NAME }}
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}